{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-cost-optimizer.serviceAccountName" . }}
  labels:
    {{- include "k8s-cost-optimizer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The token is not auto-mounted into every container by default in newer
# Kubernetes; it is requested explicitly by the Deployment because the optimizer
# needs it to talk to the API server.
automountServiceAccountToken: true
{{- end }}

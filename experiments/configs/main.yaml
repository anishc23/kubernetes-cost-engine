# Main strategy comparison: RQ1, RQ2, RQ3, RQ4, RQ5.
#
# This is the primary experiment. It evaluates every percentile strategy against
# every workload class, at four safety factors, and scores each recommendation
# against demand the engine never observed.
#
# Design notes
#
# CPU and memory strategies are crossed rather than paired, so that the best CPU
# policy and the best memory policy can differ. That cross is the experimental
# expression of the project's central hypothesis; a design that forced one shared
# strategy could not test it (the unified case is run separately as an ablation).
#
# The observation window is held fixed here at 24h so that this experiment varies
# strategy and margin only. Window length is studied on its own in windows.yaml,
# because crossing windows into this matrix would multiply it fivefold for a
# question that is cleanly separable.
name: main
description: >
  Strategy comparison across workload classes and safety factors, scored against
  held-out ground-truth demand.

workloads: []          # empty means every class in the catalog

cpu_strategies:    [current, mean, p50, p90, p95, p99, max]
memory_strategies: [current, mean, p50, p90, p95, p99, max]

observation_windows: [24h]

# 1.0 isolates the statistic itself; 1.15 and 1.25 are the shipped defaults for
# CPU and memory; 1.5 is a deliberately generous margin, included so that the
# savings/risk curve has a point where risk should be near zero and the cost of
# that safety is visible.
safety_factors: [1.0, 1.15, 1.25, 1.5]

# Ten independent trace realisations per condition. Repetition is what separates
# a real difference between strategies from a single lucky draw of a stochastic
# workload; variation across seeds is reported as a bootstrap interval in the
# analysis.
seeds: 10
base_seed: 20250901

# A 4-day trace: 3 days of history plus a 24h held-out horizon, at 30s
# resolution. 30s matches a common Prometheus scrape interval and is short enough
# to represent the 30s bursts in the catalog.
trace_duration: 96h
step: 30s

# The engine fits on the window and is scored on the following 24 hours, which it
# never sees. This is what makes the evaluation a prediction task rather than a
# description of the data the statistic was computed from.
evaluation_horizon: 24h

percentile_method: linear

feasibility:
  # One OOMKill is a failure regardless of savings; 1% of demanded CPU work
  # unserved is an acceptable operating point. The asymmetry is the CPU/memory
  # distinction expressed as an evaluation criterion.
  max_oom_kills: 0
  max_cpu_throttle_fraction: 0.01

cost_instance: m5.xlarge

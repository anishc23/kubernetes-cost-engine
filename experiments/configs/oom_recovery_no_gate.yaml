# Ablation A, corrected: the paired run with OOM protection DISABLED.
#
# Identical to oom_recovery.yaml in every respect except disable_oom_protection,
# and sharing its base seed, so the two runs differ only in the gate. Any
# difference between them is attributable to the gate alone.
#
# Why this configuration exists
#
# The first run of the OOM-protection ablation returned bit-identical results with
# the gate enabled and disabled. The cause was not a bug in the gate but a flaw in
# the experiment: every catalog workload is deliberately over-provisioned, so at
# its declared configuration it never OOMs, the synthesised reliability evidence
# always showed zero OOMKills, and the gate had nothing to act on. An ablation that
# cannot observe the component it ablates measures nothing.
#
# declared_memory_scale: 0.35 deploys each workload with roughly a third of its
# catalog memory request, which places it below true peak demand for most classes.
# Those workloads are therefore being killed at their current size, and — crucially
# — their observed working-set series is censored at the limit, so it understates
# what they actually need. That censoring is the reason the gate exists: the
# statistics say "you are using less than you reserved" precisely because the
# process keeps dying before it can use more.
#
# This is the population where the gate should matter, and the paired run against
# ablation_oom_recovery_no_gate.yaml measures whether it does.
name: oom_recovery_no_gate
description: >
  Control for the OOM-protection ablation: the same already-failing population with
  the gate disabled.

workloads: []
cpu_strategies:    [p95]
memory_strategies: [mean, p95, p99, max]
observation_windows: [24h]
safety_factors: [1.0, 1.15, 1.25, 1.5]
seeds: 10
base_seed: 20250901
trace_duration: 96h
step: 30s
evaluation_horizon: 24h
percentile_method: linear

# Deployed at ~a third of the catalog memory request: below peak demand for most
# classes, so the workload is already failing and its metrics are censored.
declared_memory_scale: 0.35

disable_oom_protection: true

feasibility:
  max_oom_kills: 0
  max_cpu_throttle_fraction: 0.01
cost_instance: m5.xlarge

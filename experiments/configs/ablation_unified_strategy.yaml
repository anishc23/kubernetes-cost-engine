# Ablation C: treat CPU and memory identically.
#
# This is the ablation that tests the project's central design claim. The engine
# is forced to apply the same strategy to both resources, which is what a naive
# right-sizer does. If the resource-specific policy is worth its complexity, this
# ablation must be measurably worse on at least one axis — and the results must
# show *which* axis, since "worse overall" is not a finding.
#
# If it is not worse, that must be reported: a design justification that the data
# does not support is not a justification.
name: ablation_unified_strategy
description: Ablation C - one shared strategy for CPU and memory.

workloads: []
cpu_strategies:    [mean, p90, p95, p99, max]
memory_strategies: [p95]   # ignored: unifiedStrategy forces memory = cpu
observation_windows: [24h]
safety_factors: [1.0, 1.15, 1.25, 1.5]
seeds: 10
base_seed: 20250901
trace_duration: 96h
step: 30s
evaluation_horizon: 24h
percentile_method: linear
unified_strategy: true
feasibility:
  max_oom_kills: 0
  max_cpu_throttle_fraction: 0.01
cost_instance: m5.xlarge

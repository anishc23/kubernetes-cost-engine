# Validation of the revised default policy.
#
# The originally shipped default was CPU p95 x1.15 with memory max x1.25. The main
# experiment refuted the CPU half of that: p95 leaves 34% of demanded CPU work
# unserved on the bursty-cpu class and 8.5% on spiky-cpu. The default was a
# hypothesis, and the evidence did not support it.
#
# The revision is derived from the same evidence rather than guessed. At a 1.25x
# margin, a p99 CPU policy is safe on every class except spiky-cpu, and observed
# burstiness (max/mean of the usage series, which the engine already computes)
# separates that class cleanly: spiky-cpu sits at 38-43 while every other class,
# bursty-cpu included at 13.0, sits below 14. Enabling the instability gate at a
# threshold of 20 should therefore withhold the reduction on exactly the class where
# p99 fails and leave the others untouched.
#
# This configuration tests that prediction. It is a *confirmatory* run of a
# hypothesis formed from the main experiment's data, on the same traces, and that
# provenance is stated in research/results.md: a threshold tuned on these ten
# synthetic classes has not been shown to generalise, and doing so would require
# production traces.
name: validate_default
description: >
  Revised default policy (CPU p99 x1.25 with an instability gate, memory max x1.25)
  against the original default and the plain alternatives.

workloads: []
cpu_strategies:    [p95, p99, max]
memory_strategies: [max]
observation_windows: [24h]
safety_factors: [1.15, 1.25]
seeds: 10
base_seed: 20250901        # the same traces as main.yaml
trace_duration: 96h
step: 30s
evaluation_horizon: 24h
percentile_method: linear

# The gate under test. 20 sits between the highest safe class (bursty-cpu at ~13)
# and the failing one (spiky-cpu at ~39).
max_cpu_burstiness: 20

feasibility:
  max_oom_kills: 0
  max_cpu_throttle_fraction: 0.01
cost_instance: m5.xlarge

# Ablation A: remove OOM protection.
#
# The OOM gate blocks memory reductions for workloads with OOM history. Removing
# it should increase reported savings and increase OOMKills; the purpose of the
# ablation is to quantify both, so that the gate's cost (foregone savings) and its
# benefit (avoided kills) can be stated as numbers rather than asserted.
#
# Every other parameter matches main.yaml, so the two are directly comparable by
# concatenating their result files and filtering on oom_protection_enabled.
name: ablation_no_oom_protection
description: Ablation A - OOM protection gate disabled.

workloads: []
cpu_strategies:    [p95, p99, max]
memory_strategies: [p95, p99, max]
observation_windows: [24h]
safety_factors: [1.0, 1.15, 1.25, 1.5]
seeds: 10
base_seed: 20250901        # identical to main.yaml: the same traces, so the only
                          # difference between the two runs is the gate
trace_duration: 96h
step: 30s
evaluation_horizon: 24h
percentile_method: linear
disable_oom_protection: true
feasibility:
  max_oom_kills: 0
  max_cpu_throttle_fraction: 0.01
cost_instance: m5.xlarge

# Observation-window sensitivity and recommendation stability: RQ6, RQ7.
#
# The engine is fitted on windows from 1 hour to 3 days and scored on the same
# held-out 24 hours in every case, so the comparison isolates history length
# rather than comparing different futures.
#
# stabilityRecomputations additionally slides each window forward eight times,
# recomputing the recommendation at each step, to measure how much the advice
# moves between scheduled runs. Volatility is an operational property that
# accuracy metrics do not capture: every change forces a pod rollout.
name: windows
description: >
  Effect of observation-window length on recommendation accuracy, savings and
  run-to-run stability.

workloads: []

# The two shipped defaults plus the two extremes that bracket them, keeping the
# matrix small enough that the window dimension is the visible one.
cpu_strategies:    [p95, p99, max]
memory_strategies: [p95, p99, max]

observation_windows: [1h, 6h, 24h, 72h]

safety_factors: [1.15]

seeds: 10
base_seed: 20250902

trace_duration: 168h     # 7 days: the longest window (72h) plus horizon plus slide
step: 30s
evaluation_horizon: 12h

# Eight recomputations at 12h strides covers four days of scheduled runs.
stability_recomputations: 8

percentile_method: linear

feasibility:
  max_oom_kills: 0
  max_cpu_throttle_fraction: 0.01

cost_instance: m5.xlarge

# Ablations B, D and E combined: every safety gate and post-processing step
# disabled.
#
# This isolates the raw statistical policy from everything the engine layers on
# top of it: OOM protection, the usage-exceeds-request check, the floors, the
# minimum-change threshold and quantity rounding. It answers the question "how
# much of the engine's behaviour is the percentile, and how much is the
# machinery?" — which is the question an ablation study exists to answer.
name: ablation_no_gates
description: All safety gates and post-processing disabled; raw statistical policy only.

workloads: []
cpu_strategies:    [mean, p95, p99, max]
memory_strategies: [mean, p95, p99, max]
observation_windows: [24h]
safety_factors: [1.0, 1.25]
seeds: 10
base_seed: 20250901
trace_duration: 96h
step: 30s
evaluation_horizon: 24h
percentile_method: linear
disable_oom_protection: true
disable_usage_exceeds: true
disable_floors: true
disable_min_change: true
disable_rounding: true
feasibility:
  max_oom_kills: 0
  max_cpu_throttle_fraction: 0.01
cost_instance: m5.xlarge
